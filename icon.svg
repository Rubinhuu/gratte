<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#1f6b4f"/>
      <stop offset="0.6" stop-color="#0f3d2e"/>
      <stop offset="1" stop-color="#08241b"/>
    </radialGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#d9982a"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f3"/>
      <stop offset="0.45" stop-color="#b9c0c6"/>
      <stop offset="0.55" stop-color="#d7dce0"/>
      <stop offset="1" stop-color="#9aa2a9"/>
    </linearGradient>
    <linearGradient id="reveal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7de"/>
      <stop offset="1" stop-color="#ffe9a8"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.5" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#c98a1b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="scratchZone">
      <rect x="-118" y="-52" width="236" height="118" rx="14"/>
    </clipPath>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Petites étincelles -->
  <g fill="#ffe08a">
    <path d="M404 92 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
    <path d="M100 398 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" opacity="0.8"/>
    <circle cx="430" cy="190" r="5" opacity="0.7"/>
    <circle cx="86" cy="140" r="4" opacity="0.6"/>
  </g>

  <!-- Billet incliné -->
  <g transform="translate(256 262) rotate(-10)" filter="url(#shadow)">
    <!-- Corps du billet avec encoches -->
    <path d="M-170 -110 H170 a16 16 0 0 1 16 16 V-22 a24 24 0 0 0 0 48 V94 a16 16 0 0 1 -16 16 H-170 a16 16 0 0 1 -16 -16 V26 a24 24 0 0 0 0 -48 V-94 a16 16 0 0 1 16 -16z"
          fill="url(#ticket)"/>
    <!-- Liseré -->
    <path d="M-160 -96 H160 V96 H-160z" fill="none" stroke="#b87a17" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.7"/>
    <!-- Titre -->
    <rect x="-118" y="-86" width="236" height="22" rx="11" fill="#0f3d2e" opacity="0.9"/>
    <g fill="#f2c14e">
      <circle cx="-80" cy="-75" r="5"/><circle cx="-40" cy="-75" r="5"/><circle cx="0" cy="-75" r="5"/>
      <circle cx="40" cy="-75" r="5"/><circle cx="80" cy="-75" r="5"/>
    </g>

    <!-- Zone à gratter -->
    <g clip-path="url(#scratchZone)">
      <rect x="-118" y="-52" width="236" height="118" fill="url(#reveal)"/>
      <!-- Gain révélé : étoile dorée -->
      <path d="M40 -26 l12 25 27 4 -20 19 5 27 -24 -13 -24 13 5 -27 -20 -19 27 -4z" fill="#e8a317" stroke="#b87a17" stroke-width="3" stroke-linejoin="round"/>
      <!-- Couche argentée partiellement grattée -->
      <path d="M-118 -52 H118 V-40 C80 -30 70 -10 20 -20 C-10 -26 -20 0 -10 30 C-2 52 40 60 118 44 V66 H-118z"
            fill="url(#silver)"/>
      <!-- Texture de grattage -->
      <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.45">
        <path d="M-100 -30 L-60 -40"/><path d="M-104 0 L-50 -14"/><path d="M-98 30 L-40 16"/><path d="M-80 54 L-30 44"/>
      </g>
      <!-- Miettes de grattage -->
      <g fill="#aeb5bb">
        <circle cx="30" cy="42" r="4"/><circle cx="92" cy="-30" r="3"/><circle cx="-4" cy="-4" r="3"/>
      </g>
    </g>
    <rect x="-118" y="-52" width="236" height="118" rx="14" fill="none" stroke="#b87a17" stroke-width="3"/>
  </g>

  <!-- Pièce qui gratte -->
  <g transform="translate(372 372) rotate(-20)" filter="url(#shadow)">
    <ellipse cx="0" cy="10" rx="62" ry="62" fill="#b07515"/>
    <circle cx="0" cy="0" r="62" fill="url(#coin)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#c98a1b" stroke-width="5"/>
    <text x="0" y="17" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="50" fill="#9a6410">₣</text>
  </g>
</svg>
